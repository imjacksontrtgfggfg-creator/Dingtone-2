
name: Build Dingtone 2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -o Dingtone2Android_with_backend.zip
      - name: Build APK
        run: gradle -p Dingtone2Android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dingtone2-demo-APK
          path: Dingtone2Android/app/build/outputs/apk/debug/app-debug.apk
          
